<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMAUCE IA 🇨🇩</title>
<style>
body{background:#111;color:white;font-family:sans-serif;margin:0}
.header{background:#ff6a00;padding:15px;text-align:center;font-weight:bold;font-size:22px}
#chat{padding:15px;height:70vh;overflow-y:auto}
.msg{background:#222;margin:10px 0;padding:12px;border-radius:10px}
.user{background:#ff6a00;color:#000;text-align:right}
.input-area{position:fixed;bottom:0;width:100%;background:#111;padding:10px;display:flex}
input{flex:1;padding:15px;border-radius:25px;border:none}
button{background:#ff6a00;border:none;padding:15px 20px;border-radius:25px;margin-left:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header">EMAUCE IA 🇨🇩 - Mbote Boss!</div>
<div id="chat"><div class="msg">Mbote Boss! Pose ta question 🔥</div></div>
<div class="input-area">
<input id="q" placeholder="Écris ici...">
<button onclick="ask()">Envoyer</button>
</div>
<script>
async function ask(){
let q=document.getElementById('q').value;
if(!q)return;
let chat=document.getElementById('chat');
chat.innerHTML+='<div class="msg user">'+q+'</div>';
document.getElementById('q').value='';
let r=await fetch('/ask?q='+encodeURIComponent(q));
let t=await r.text();
chat.innerHTML+='<div class="msg">'+t+'</div>';
chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
