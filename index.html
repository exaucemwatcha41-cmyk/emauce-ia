<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMAUCE IA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:white;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
header{padding:12px;text-align:center;background:#1a1a1a;border-bottom:1px solid #333;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:15px}
.row{display:flex;gap:10px;max-width:90%}.row.user{align-self:flex-end;flex-direction:row-reverse}.row.bot{align-self:flex-start}
.bubble{padding:12px 16px;border-radius:18px;white-space:pre-wrap;line-height:1.4;font-size:15px}
.user.bubble{background:#ff6a00;color:white;border-bottom-right-radius:4px}
.bot.bubble{background:#262626;border-bottom-left-radius:4px}
.avatar{width:32px;height:32px;border-radius:50%;background:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
#bar{padding:10px;background:#1a1a1a;display:flex;gap:8px;border-top:1px solid #333}
#input{flex:1;background:#2a2a2a;border:none;padding:12px 16px;border-radius:25px;color:white;outline:none}
button{background:#ff6a00;border:none;padding:10px 18px;border-radius:25px;color:white;font-weight:bold}
#typing{font-size:13px;color:#888;padding:5px 15px;display:none}
</style>
</head>
<body>
<header>EMAUCE IA 🇨🇩 - Ton vrai robot</header>
<div id="chat"></div>
<div id="typing">Emauce IA écrit...</div>
<div id="bar"><input id="input" placeholder="Message..."><button onclick="send()">➤</button></div>
<script>
let history = [];
const chatDiv = document.getElementById('chat');
function add(text, who){
  let row = document.createElement('div'); row.className='row '+who;
  row.innerHTML=`<div class="avatar">${who=='user'?'👤':'🤖'}</div><div class="bubble">${text}</div>`;
  chatDiv.appendChild(row); chatDiv.scrollTop=chatDiv.scrollHeight;
}
add("Mbote Boss! 🔥 Moi c'est Emauce IA, ton vrai robot comme Meta AI. Pose-moi n'importe quoi, je suis là!","bot");

async function send(){
  let input=document.getElementById('input'); let text=input.value.trim(); if(!text)return;
  add(text,'user'); history.push({role:"user", content:text}); input.value='';
  document.getElementById('typing').style.display='block';
  let res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
  let data=await res.json();
  document.getElementById('typing').style.display='none';
  add(data.reply,'bot'); history.push({role:"assistant", content:data.reply});
}
document.getElementById('input').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
